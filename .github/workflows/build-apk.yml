name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          unzip -q android.zip -d tmp_unzip
          if [ -d tmp_unzip/android ]; then cp -r tmp_unzip/android/* .; else cp -r tmp_unzip/* .; fi
          rm -rf tmp_unzip android.zip
          rm -f local.properties
          ls -l
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
